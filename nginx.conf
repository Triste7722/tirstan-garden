# ==========================================================================
# MyBlog — Nginx 站点配置
# 部署时会被 deploy.sh 复制到 /etc/nginx/conf.d/myblog.conf
# 核心：try_files 回退到 index.html，解决 SPA history 路由刷新 404 的问题。
# ==========================================================================

server {
    listen 80;
    server_name tirster.xin www.tirster.xin;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history 模式：所有非文件、非目录请求一律回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 构建产物（带内容 hash 的静态资源）长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
